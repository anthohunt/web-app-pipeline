<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4fd1c4"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="14" fill="#0b3959"/>

  <text x="30" y="50" fill="#ffffff" font-size="24" font-weight="700">Web App Pipeline</text>
  <text x="30" y="76" fill="#b4cad8" font-size="16">An idea goes in. A deployed, tested web application comes out, with its design and its documentation.</text>

  <!-- 1. Input -->
  <rect x="30" y="130" width="230" height="170" rx="12" fill="#12445d" stroke="#f2c879" stroke-width="2"/>
  <text x="145" y="168" text-anchor="middle" fill="#f2c879" font-size="15" font-weight="700" letter-spacing="1">YOU BRING</text>
  <g transform="translate(125,182)" fill="none" stroke="#f2c879" stroke-width="3" stroke-linejoin="round">
    <path d="M0 0 h40 v26 h-24 l-10 9 v-9 h-6 z"/>
  </g>
  <text x="145" y="244" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">An idea, a need</text>
  <text x="145" y="270" text-anchor="middle" fill="#b4cad8" font-size="15">in plain words</text>

  <line x1="262" y1="215" x2="322" y2="215" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2. Black box -->
  <rect x="328" y="110" width="330" height="210" rx="14" fill="#06263c" stroke="#4fd1c4" stroke-width="2"/>
  <text x="493" y="150" text-anchor="middle" fill="#4fd1c4" font-size="13" font-weight="700" letter-spacing="1">PIPELINE OF AI AGENTS</text>
  <g fill="#4fd1c4" opacity="0.9">
    <circle cx="433" cy="200" r="9"/><circle cx="473" cy="200" r="9"/><circle cx="513" cy="200" r="9"/><circle cx="553" cy="200" r="9"/>
    <circle cx="453" cy="232" r="9" opacity="0.6"/><circle cx="493" cy="232" r="9" opacity="0.6"/><circle cx="533" cy="232" r="9" opacity="0.6"/>
  </g>
  <text x="493" y="276" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">design · build · test · deploy</text>
  <text x="493" y="300" text-anchor="middle" fill="#b4cad8" font-size="14">method proprietary</text>

  <line x1="660" y1="215" x2="720" y2="215" stroke="#4fd1c4" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3. Outputs -->
  <rect x="726" y="100" width="444" height="54" rx="10" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <text x="746" y="134" fill="#ffffff" font-size="17" font-weight="600">Live web application</text>
  <text x="1150" y="134" text-anchor="end" fill="#7fe0b5" font-size="14">public URL</text>

  <rect x="726" y="162" width="444" height="54" rx="10" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <text x="746" y="196" fill="#ffffff" font-size="17" font-weight="600">Clickable mockup + user stories</text>
  <text x="1150" y="196" text-anchor="end" fill="#7fe0b5" font-size="14">tied to each screen</text>

  <rect x="726" y="224" width="444" height="54" rx="10" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <text x="746" y="258" fill="#ffffff" font-size="17" font-weight="600">Automated tests</text>
  <text x="1150" y="258" text-anchor="end" fill="#7fe0b5" font-size="14">unit + browser</text>

  <rect x="726" y="286" width="444" height="54" rx="10" fill="#1e5a52" stroke="#4fd1c4" stroke-width="2"/>
  <text x="746" y="320" fill="#ffffff" font-size="17" font-weight="600">Illustrated user-journey walkthrough</text>
  <text x="1150" y="320" text-anchor="end" fill="#7fe0b5" font-size="14">screenshots</text>

  <text x="30" y="376" fill="#b4cad8" font-size="14">Below: two applications it delivered, both online, with their tests and documentation.</text>
</svg>
